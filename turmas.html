<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turma</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2 id="tituloTurma"></h2>

<div class="card p-4 mb-4">

<h4 class="mb-3">Cadastrar Aluno</h4>

<div class="row g-3">

<div class="col-md-6">
<input
type="text"
id="nomeAluno"
class="form-control"
placeholder="Nome do aluno">
</div>

<div class="col-md-6">
<input
type="email"
id="emailAluno"
class="form-control"
placeholder="E-mail">
</div>

<div class="col-md-6">
<input
type="date"
id="nascimentoAluno"
class="form-control">
</div>

<div class="col-md-6">
<input
type="text"
id="matriculaAluno"
class="form-control"
placeholder="Matrícula">
</div>

<div class="col-12">
<button
class="btn btn-success"
onclick="adicionarAluno()">

Cadastrar
</button>
</div>

</div>

</div>

<h4>Alunos da Turma</h4>

<div id="listaAlunos"></div>

<a href="turmas.html" class="btn btn-secondary mt-3">
Voltar
</a>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const turma = params.get("turma");

document.getElementById("tituloTurma").innerText =
`📁 Turma ${turma}`;

function carregarAlunos() {

const dados =
JSON.parse(localStorage.getItem("turmas")) || {};

const alunos =
dados[turma] || [];

let html = "";

alunos.forEach((aluno, index) => {

html += `
<div class="card mb-3 shadow-sm">

<div class="card-body">

<h5>${aluno.nome}</h5>

<p class="mb-1">
📧 ${aluno.email}
</p>

<p class="mb-1">
🎂 ${aluno.nascimento}
</p>

<p class="mb-2">
🆔 ${aluno.matricula}
</p>

<button
class="btn btn-danger btn-sm"
onclick="removerAluno(${index})">

Excluir

</button>

</div>

</div>
`;

});

document.getElementById("listaAlunos").innerHTML =
html;

}

function adicionarAluno() {

const nome =
document.getElementById("nomeAluno").value;

const email =
document.getElementById("emailAluno").value;

const nascimento =
document.getElementById("nascimentoAluno").value;

const matricula =
document.getElementById("matriculaAluno").value;

if (
nome === "" ||
email === "" ||
nascimento === "" ||
matricula === ""
) {
alert("Preencha todos os campos");
return;
}

const dados =
JSON.parse(localStorage.getItem("turmas")) || {};

if (!dados[turma]) {
dados[turma] = [];
}

dados[turma].push({
nome,
email,
nascimento,
matricula
});

localStorage.setItem(
"turmas",
JSON.stringify(dados)
);

document.getElementById("nomeAluno").value = "";
document.getElementById("emailAluno").value = "";
document.getElementById("nascimentoAluno").value = "";
document.getElementById("matriculaAluno").value = "";

carregarAlunos();

}

function removerAluno(index) {

const dados =
JSON.parse(localStorage.getItem("turmas")) || {};

dados[turma].splice(index, 1);

localStorage.setItem(
"turmas",
JSON.stringify(dados)
);

carregarAlunos();

}

carregarAlunos();

</script>

</body>
</html>
