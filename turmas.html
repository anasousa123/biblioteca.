<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turma</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2 id="tituloTurma"></h2>

<div class="card p-3 mb-3">

<h5>Cadastrar aluno</h5>

<div class="input-group">
<input type="text" id="nomeAluno" class="form-control" placeholder="Nome do aluno">

<button class="btn btn-success" onclick="adicionarAluno()">
Cadastrar
</button>
</div>

</div>

<div id="listaAlunos"></div>

<a href="turmas.html" class="btn btn-secondary mt-3">
Voltar
</a>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const turma = params.get("turma");

document.getElementById("tituloTurma").innerText = `📁 Turma ${turma}`;

function carregarAlunos() {

    const dados = JSON.parse(localStorage.getItem("turmas")) || {};

    const alunos = dados[turma] || [];

    let html = "";

    alunos.forEach((aluno, index) => {

        html += `
        <div class="card mb-2">
            <div class="card-body d-flex justify-content-between">
                <span>👤 ${aluno}</span>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="removerAluno(${index})">
                    Excluir
                </button>
            </div>
        </div>
        `;
    });

    document.getElementById("listaAlunos").innerHTML = html;
}

function adicionarAluno() {

    const nome = document.getElementById("nomeAluno").value.trim();

    if(nome === "") return;

    const dados = JSON.parse(localStorage.getItem("turmas")) || {};

    if(!dados[turma]) {
        dados[turma] = [];
    }

    dados[turma].push(nome);

    localStorage.setItem("turmas", JSON.stringify(dados));

    document.getElementById("nomeAluno").value = "";

    carregarAlunos();
}

function removerAluno(index) {

    const dados = JSON.parse(localStorage.getItem("turmas")) || {};

    dados[turma].splice(index, 1);

    localStorage.setItem("turmas", JSON.stringify(dados));

    carregarAlunos();
}

carregarAlunos();

</script>

</body>
</html>
