<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Turmas</title>
<link rel="icon" href="favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2 class="mb-4"> Turmas</h2>

<div class="row" id="pastas"></div>

</div>

<script>

const turmas = [
  "601","602",
  "701","702",
  "801","802",
  "901","902",
  "1001",
  "2001",
  "3001"
];

const container =
document.getElementById("pastas");

turmas.forEach(turma => {

  container.innerHTML += `
    <div class="col-md-3 mb-3">

      <div class="card text-center shadow-sm">

        <div class="card-body">

          <h1>📁</h1>

          <h5>Turma ${turma}</h5>

          <a
            href="turma.html?turma=${turma}"
            class="btn btn-primary">

            Abrir

          </a>

        </div>

      </div>

    </div>
  `;
});

</script>

</body>
</html>
